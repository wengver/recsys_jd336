[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wengver-recsys_jd336"
version = "0.1.0"
description = "从输入中抽取数值，计算推荐系统算法工程师·注意力核��的访存瓶颈相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "wengver" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://wengver.github.io"
Repository = "https://github.com/wengver/recsys_jd336"
Issues = "https://github.com/wengver/recsys_jd336/issues"

[project.scripts]
recsys_jd336 = "recsys_jd336:main"

[tool.setuptools]
py-modules = ["recsys_jd336"]
